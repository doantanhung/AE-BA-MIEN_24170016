<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giới thiệu | đoàn tấn hùng</title>
  <style>
    :root { --ink: #26334a; --muted: #69758b; --accent: #5369d7; --pale: #eff2ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px; display: grid; place-items: center;
      background: linear-gradient(145deg, #f4f6ff, #e7f4f3);
      color: var(--ink); font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(100%, 660px); padding: clamp(28px, 6vw, 50px);
      background: #fff; border: 1px solid #e7eaf3; border-radius: 22px;
      box-shadow: 0 18px 55px #28375a18;
    }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.12; }
    .major { margin: 12px 0 30px; color: var(--muted); font-size: 1.08rem; }
    section { padding-top: 22px; border-top: 1px solid #edf0f5; }
    section + section { margin-top: 22px; }
    h2 { margin: 0 0 14px; font-size: 1rem; }
    .skills { display: flex; flex-wrap: wrap; gap: 9px; }
    .skills span { padding: 8px 13px; border-radius: 999px; background: var(--pale); color: #384da9; }
    .goal { margin: 0; padding: 14px 17px; border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; background: #f7f8ff; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Giới thiệu</p>
      <h1>đoàn tấn hùng</h1>
      <p class="major">Truyen Thong đa phương tiện</p>
    </header>
    <section aria-labelledby="skills-title">
      <h2 id="skills-title">Kỹ năng</h2>
      <div class="skills"><span>an</span><span>uong</span><span>choi</span><span>ngu</span></div>
    </section>
    <section aria-labelledby="goal-title">
      <h2 id="goal-title">Mục tiêu nghề nghiệp</h2>
      <p class="goal">Viet Code, day Ai</p>
    </section>
  </main>
</body>
</html>
